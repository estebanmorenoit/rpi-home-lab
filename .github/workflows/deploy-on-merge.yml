name: Deploy Updated Stack

on:
  push:
    branches:
      - main  # Trigger on merge into main

jobs:
  deploy:
    name: Pull and Recreate Docker Stack
    runs-on: [self-hosted, homelab]  # Match your runner's labels

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull latest images
        run: docker compose pull $(docker compose config --services | grep -v github-runner)

      - name: Recreate updated services
        run: docker compose up -d --force-recreate --no-deps $(docker compose config --services | grep -v github-runner)

