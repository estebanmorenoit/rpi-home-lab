name: Deploy Updated Stack

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, homelab]
    defaults:
      run:
        shell: sh
        working-directory: /workdir

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug Loki config in GitHub runner
        run: |
          echo "WORKDIR: $PWD"
          ls -l ./loki
          file ./loki/local-config.yaml

      - name: Pull latest images
        run: docker compose -p docker-stack pull

      - name: Restart containers
        run: docker compose -p docker-stack up -d --no-build --remove-orphans
