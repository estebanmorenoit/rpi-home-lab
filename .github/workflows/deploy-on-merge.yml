name: Deploy Updated Stack

on:
  push:
    branches:
      - main  # Or whatever branch Renovate merges into

jobs:
  deploy:
    name: Update and Restart Docker Compose Stack
    runs-on: [self-hosted, homelab]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest images
        run: |
          docker compose pull

      - name: Restart containers with updated images
        run: |
          docker compose up -d --no-build --remove-orphans
