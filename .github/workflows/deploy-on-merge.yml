name: Deploy Updated Stack

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, homelab]
    defaults:
      run:
        working-directory: /home/esteban/docker-stack  # 👈 use host path directly

    steps:
      - name: Pull latest images
        run: docker compose -p docker-stack pull

      - name: Restart containers
        run: docker compose -p docker-stack up -d --no-build --remove-orphans
