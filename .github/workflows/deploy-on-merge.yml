name: Deploy Updated Stack

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, homelab]
    defaults:
      run:
        shell: sh
        working-directory: /workdir

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest images
        run: docker compose -p docker-stack pull

      - name: Start containers (excluding github-runner)
        run: |
          services=$(docker compose config --services | grep -v github-runner)
          docker compose -p docker-stack up -d --no-build --remove-orphans $services
