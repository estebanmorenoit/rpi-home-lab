name: Deploy with Tailscale GitHub Action

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-deployer

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: SSH into Raspberry Pi over Tailscale
        run: |
          ssh -o StrictHostKeyChecking=accept-new esteban@raspberrypi.pancake-edmontosaurus.ts.net <<'EOF'
            cd ~/docker-stack
            git pull origin main
            docker compose -p docker-stack pull
            docker container prune -f
            docker compose -p docker-stack up -d --remove-orphans
          EOF
