version: "3.9"

services:

  # -----------------------------
  # 🏠 Core Services
  # -----------------------------

  # Home Assistant
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2025.6
    container_name: homeassistant
    restart: always
    volumes:
      - ./homeassistant:/config
    privileged: true
    network_mode: host
    environment:
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # AdGuard Home (DNS + DHCP)
  adguard:
    image: adguard/adguardhome:v0.107.63
    container_name: adguard
    restart: always
    volumes:
      - adguard-config:/opt/adguardhome
    ports:
      - "8080:80"
      - "3000:3000"
      - "53:53/tcp"
      - "53:53/udp"
    environment:
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - internal

  # -----------------------------
  # 📊 Monitoring Stack
  # -----------------------------

  # Prometheus (metrics database)
  prometheus:
    image: prom/prometheus:v3.4.2
    container_name: prometheus
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-storage:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'   # Keep only 7 days
      - '--storage.tsdb.path=/prometheus'
    # ports:
    #   - "9090:9090"
    restart: always
    environment:
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - internal


  # Node Exporter (host metrics)
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    # ports:
    #   - "9100:9100"
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    read_only: true
    networks:
      - internal
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.ignored-mount-points='

  # cAdvisor (container metrics)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    restart: unless-stopped
    # ports:
    #   - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    environment:
      - TZ=${TZ}
    read_only: true
    networks:
      - internal

  # Grafana (dashboards)
  grafana:
    image: grafana/grafana:12.0.2
    container_name: grafana
    restart: unless-stopped
    # ports:
    #   - "3001:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      # Provisioning and dashboards from host
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - internal

  # Loki (logs database)
  loki:
    image: grafana/loki:3.5.1
    container_name: loki
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki/local-config.yaml:/etc/loki/config.yaml:ro
      - ./loki/chunks:/loki/chunks
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - internal

  # Promtail (log collector)
  promtail:
    image: grafana/promtail:3.5.1
    container_name: promtail
    volumes:
      - /var/log:/var/log
      - /etc/machine-id:/etc/machine-id
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/promtail.yaml:/etc/promtail-config/promtail.yaml:ro
    environment:
      - TZ=${TZ}
    command: -config.file=/etc/promtail-config/promtail.yaml
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - internal
  
  # Uptime Kuma (self-hosted uptime monitor)
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    container_name: uptime-kuma
    restart: unless-stopped
    # ports:
    #   - "3003:3001"
    volumes:
      - uptime-kuma-storage:/app/data
    dns:
      - 192.168.6.59
    environment:
      - TZ=${TZ}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - internal

  # Speedtest Tracker
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:1.6.1
    container_name: speedtest-tracker
    restart: always
    # ports:
    #   - "8765:80"   # Custom HTTP port (change if using HTTPS or want to expose 443 too)
    #   - "8443:443"  # Optional: expose HTTPS port if needed
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - APP_KEY=${APP_KEY}              # Set in .env or replace directly here
      - DB_CONNECTION=sqlite
      - APP_DEBUG=true
      - SPEEDTEST_SCHEDULE="17 * * * *"
    volumes:
      - speedtest_config:/config
      # Optional: uncomment if using custom SSL certs
      # - ./speedtest-tracker/ssl:/config/keys
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - internal


    
  # -----------------------------
  # 🛠 Management & Admin
  # -----------------------------

  # Portainer (UI for Docker)
  portainer:
    image: portainer/portainer-ce:2.31.2
    container_name: portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-storage:/data
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - internal

  # # Watchtower (auto-updater)
  # watchtower:
  #   image: containrrr/watchtower:1.7.1
  #   container_name: watchtower
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   restart: unless-stopped
  #   environment:
  #     - TZ=${TZ}
  #     - WATCHTOWER_CLEANUP=true
  #     - WATCHTOWER_LABEL_ENABLE=true
  #     - WATCHTOWER_NOTIFICATIONS=shoutrrr
  #     - WATCHTOWER_NOTIFICATION_URL=telegram://8053089884:AAE3ke-ZaFl2Z6ejYAL-ZChL6nTBuywBQ6Q@telegram?channels=-4812444281
  #   networks:
  #     - internal

  # Homepage (dashboard UI)
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.3.2
    container_name: homepage
    volumes:
      # - homepage-storage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
      - ./homepage/bookmarks.yaml:/app/config/bookmarks.yaml:ro
      - ./homepage/services.yaml:/app/config/services.yaml:ro
      - ./homepage/widgets.yaml:/app/config/widgets.yaml:ro
      - ./homepage/settings.yaml:/app/config/settings.yaml:ro
      - ./homepage/docker.yaml:/app/config/docker.yaml:ro
      - ./homepage/kubernetes.yaml:/app/config/kubernetes.yaml:ro
      - ./homepage/custom.css:/app/config/custom.css:ro
      - ./homepage/custom.js:/app/config/custom.js:ro
    # ports:
    #   - "3002:3000"
    restart: unless-stopped
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=*
      - TZ=${TZ}
    # healthcheck:
    #   test: ["CMD-SHELL", "wget --spider -q http://0.0.0.0:3000 || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - internal

  # -----------------------------
  # 🌐 Reverse Proxy
  # -----------------------------

  # Caddy (HTTPS reverse proxy)
  caddy:
    image: caddy:2.10.0
    container_name: caddy-proxy
    restart: always 
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      grafana:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      homeassistant:
        condition: service_started
      adguard:
        condition: service_healthy
      loki:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - EMAIL=${EMAIL}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - internal
      - frontend

  # -----------------------------
  # 🚀 GitHub Actions Runner
  # -----------------------------

  # github-runner:
  #   image: myoung34/github-runner:latest
  #   container_name: github-runner
  #   restart: unless-stopped
  #   environment:
  #     - RUNNER_NAME=rpi-homelab-github-runner
  #     - RUNNER_WORKDIR=/workdir
  #     - REPO_URL=https://github.com/estebanmorenoit/rpi-home-lab
