  #     - TZ=${TZ}
  #     - RUNNER_GROUP=default
  #     - RUNNER_SCOPE=repo
  #     - LABELS=homelab,docker
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - /home/esteban/docker-stack:/workdir         # 👈 Add this
  #   network_mode: host
  #   labels:
  #     - "com.centurylinklabs.watchtower.enable=true"


# -----------------------------
# 🔌 Networks & Volumes
# -----------------------------

networks:
  internal:
  frontend:

volumes:
  caddy_data:
  caddy_config:
  grafana-storage:
  prometheus-storage:
  uptime-kuma-storage:
  portainer-storage:
  homepage-storage:
  homeassistant-config:
  adguard-config:
  speedtest_config:
